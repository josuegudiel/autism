<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Brújula TEA — simulador de iPhone</title>
<!--
  Simulador de iPhone 15 Pro para revisar la app sin un dispositivo real.
  Uso: levanta la web  (cd web && python3 -m http.server 8099)
       y abre este archivo con  ?rutas=#inicio,#biblioteca&oscuro=0
-->
<style>
  :root { --w: 393px; --h: 852px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #16181c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 20px;
  }
  .wrap { display: flex; gap: 40px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .caption { color: #8b9099; font-size: 13px; letter-spacing: .02em; }

  /* ------- carcasa del iPhone ------- */
  .iphone {
    position: relative;
    width: calc(var(--w) + 22px);
    height: calc(var(--h) + 22px);
    background: linear-gradient(160deg, #3a3f47, #22262c 40%, #33383f);
    border-radius: 56px;
    padding: 11px;
    box-shadow: 0 0 0 1.5px #55595f, 0 30px 70px rgba(0,0,0,.55);
  }
  /* botones laterales */
  .iphone::before, .iphone::after {
    content: ""; position: absolute; background: #2a2e34; border-radius: 2px;
  }
  .iphone::before { left: -2.5px; top: 168px; width: 3px; height: 62px;
    box-shadow: 0 82px 0 #2a2e34, 0 -108px 0 0 #2a2e34; }
  .iphone::after { right: -2.5px; top: 200px; width: 3px; height: 96px; }

  .screen {
    position: relative; width: var(--w); height: var(--h);
    border-radius: 46px; overflow: hidden; background: #fff;
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ------- barra de estado ------- */
  .status {
    position: absolute; inset: 0 0 auto 0; height: 54px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 30px 0; pointer-events: none;
    font-size: 15px; font-weight: 600; color: #000;
    letter-spacing: -.01em;
  }
  .status.oscuro { color: #fff; }
  .status .der { display: flex; align-items: center; gap: 5px; }
  .isla {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 125px; height: 36px; background: #000; border-radius: 20px; z-index: 6;
  }
  /* barra de gestos */
  .gesto {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.35); z-index: 6;
  }
  .oscuro-gesto { background: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <div class="wrap" id="wrap"></div>
<script>
  const params = new URLSearchParams(location.search);
  const rutas = (params.get("rutas") || "#inicio").split(",");
  const oscuro = params.get("oscuro") === "1";
  const base = params.get("base") || "http://localhost:8099/index.html";

  document.getElementById("wrap").innerHTML = rutas.map((r, i) => `
    <div class="col">
      <div class="iphone">
        <div class="screen">
          <div class="isla"></div>
          <div class="status ${oscuro ? "oscuro" : ""}">
            <span>9:41</span>
            <span class="der">
              <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.5" y="5.5" width="3" height="5.5" rx="1"/><rect x="9" y="3" width="3" height="8" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
              <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.5 5.6 8a3.4 3.4 0 0 1 4.8 0zM3.4 5.8 1.9 4.3a8.6 8.6 0 0 1 12.2 0l-1.5 1.5a6.5 6.5 0 0 0-9.2 0z"/></svg>
              <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".5"/></svg>
            </span>
          </div>
          <iframe src="${base}${r}" title="Brújula TEA"></iframe>
          <div class="gesto ${oscuro ? "oscuro-gesto" : ""}"></div>
        </div>
      </div>
      <div class="caption">${r.replace("#", "")}</div>
    </div>`).join("");
</script>
</body>
</html>
